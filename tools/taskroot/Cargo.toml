[package]
name = "taskroot"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Project-local Markdown task tracking for humans and coding agents"
documentation = "https://docs.rs/taskroot"
homepage = "https://github.com/NgTHung/Filer/tree/main/taskroot"
repository = "https://github.com/NgTHung/Filer"
readme = "README.md"
license = "MIT"
keywords = ["tasks", "markdown", "cli", "local-first", "agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.27.0"
