[package]
name = "filer-core"
version = "0.2.3"
edition = "2024"

[dependencies]
flume = "0.12.0"
rapidhash = "4.4.1"
tracing = { workspace = true }
tokio = { workspace = true }
tokio-stream = {workspace = true}
async-trait = "0.1.89"
chrono = "0.4"
scc = "3.4.15"
serde = { workspace = true }
serde_json = { workspace = true }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
regex = "1"
infer = "0.19.0"
trash = "5.2"

new_mime_guess = "4.0.4"
mime = "0.3.17"

# Remote FS dependencies (optional)
# S3
aws-sdk-s3 = { version = "1.0", optional = true }
aws-config = { version = "1.0", optional = true }

# WebDAV
reqwest = { version = "0.13.1", optional = true }

# FTP/SFTP
suppaftp = { version = "8.0.1", optional = true }
ssh2 = { version = "0.9", optional = true }

# FUSE
fuser = { version = "0.17.0", optional = true }

# Kubernetes
kube = { version = "3.0.0", features = [
    "client",
    "rustls-tls",
], optional = true }
k8s-openapi = { version = "0.27.0", features = ["latest"], optional = true }

syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
imagesize = { version = "0.14.0", optional = true }
kamadak-exif = { version = "0.6.1", optional = true }
id3 = { version = "1", optional = true }
mp4parse = { version = "0.17", optional = true }
lopdf = { version = "0.40", optional = true }
# Archive dependencies (optional)
zip = { version = "8.3.1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6.1", optional = true }
xz2 = { version = "0.1", optional = true }
zstd = { version = "0.13", optional = true }
sevenz-rust2 = { version = "0.21.0", optional = true }
unrar = { version = "0.5.8", optional = true }
tempfile = { version = "3.27.0", optional = true } # runtime temp for nested archive chaining

[features]
default = ["metadata"]
# Crypto features
# Remote filesystem features
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
webdav = ["dep:reqwest"]
ftp = ["dep:suppaftp", "ssh2"]
sftp = ["ftp"]
fuse = ["dep:fuser"]
kubernetes = ["dep:kube", "dep:k8s-openapi"]
# Convenience feature groups
all-remote = ["s3", "webdav", "ftp", "sftp", "fuse", "kubernetes"]
metadata-image = ["dep:imagesize", "dep:kamadak-exif"]
metadata-audio = ["dep:id3"]
metadata-video = ["dep:mp4parse"]
metadata-document = ["dep:lopdf"]
metadata-archive = [
    "dep:zip", "dep:tar", "dep:flate2", "dep:bzip2", "dep:xz2", "dep:zstd",
    "dep:sevenz-rust2", "dep:tempfile",
]
metadata-archive-rar = ["metadata-archive", "dep:unrar"]   # links unrar C++; see RARlab license
metadata = [
    "metadata-image",
    "metadata-audio",
    "metadata-video",
    "metadata-document",
    "metadata-archive",
]
preview-code  = ["dep:syntect"]
preview-image = ["dep:image"]
preview       = ["preview-code", "preview-image"]
all-features = ["all-remote", "metadata-archive-rar", "metadata", "preview"]

[dev-dependencies]
tempfile = "3.27.0"  # also listed as optional dep for runtime archive chaining
[target.'cfg(unix)'.dependencies]
users = "0.11"
