[workspace]
resolver = "3"

[package]
name = "filer-core-benchmarks"
version = "0.1.0"
edition = "2024"

[dependencies]
filer-core = { path = "..", default-features = false }
flume = "0.12"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
